# babel.cfg
[python: **.py]
[jinja2: templates/**.html]
extensions=jinja2.ext.i18n
# Catch any gettext-style _()/gettext() calls added to standalone JS in future.
# (Template-embedded JS is already covered by the jinja2 extractor above; main.js
# currently uses its own client-side t() dictionary, not gettext.)
[javascript: static/js/**.js]