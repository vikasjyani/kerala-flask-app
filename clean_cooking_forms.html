<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Cooking Survey</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #004d40;
            --brand-soft: #e0f2f1;
            --brand: #00897b;
            --radius-lg: 12px;
            --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            --shadow-green: 0 4px 12px rgba(0, 77, 64, 0.08);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding-bottom: 50px;
        }

        .header-container {
            background: white;
            box-shadow: var(--shadow-sm);
        }

        .top-bar {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .green-strip {
            background-color: var(--brand-green);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-title {
            color: var(--brand-green);
            font-weight: 700;
        }

        .card {
            border: none;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-green);
            margin-bottom: 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .section-heading {
            color: var(--brand-green);
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }

        .subsection-heading {
            color: #555;
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eaeaea;
        }

        .form-label {
            font-weight: 500;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.75rem;
            border-color: #ced4da;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.25rem rgba(0, 137, 123, 0.25);
        }

        .btn-nav-next {
            background-color: var(--brand-green);
            color: white;
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            border: none;
        }

        .btn-nav-next:hover {
            background-color: #00332a;
            color: white;
        }

        .btn-nav-back {
            background-color: transparent;
            color: var(--brand-green);
            border: 1px solid var(--brand-green);
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
        }

        .btn-nav-back:hover {
            background-color: var(--brand-soft);
            color: var(--brand-green);
        }

        .radio-card {
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .radio-card:hover {
            background-color: var(--brand-soft);
            border-color: var(--brand);
        }

        .radio-card input[type="radio"] {
            margin-right: 12px;
            width: 1.2em;
            height: 1.2em;
        }

        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-indicator {
            font-size: 0.875rem;
            color: var(--brand);
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .question-container {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: #fcfcfc;
            border-radius: 8px;
            border-left: 4px solid var(--brand-green);
        }

        .consent-text-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #495057;
        }
    </style>
</head>
<body>

    <div class="header-container mb-4">
        <div class="green-strip">
            <div class="d-flex align-items-center">
                <span class="ms-2 text-white fw-bold fs-5">Clean Cooking Survey</span>
            </div>
        </div>
    </div>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div id="consent-screen" class="step-container active">
                    <div class="text-center mb-4">
                        <h1 class="page-title mb-2">About the Study & Consent</h1>
                    </div>
                    <div class="card shadow-green">
                        <div class="card-body">
                            <form id="consent-form">
                                <div id="consent-content">
                                    <!-- Consent text loaded here -->
                                </div>

                                <div class="mb-4">
                                    <label class="form-label d-block mb-3 fs-6">Do you consent to share your information with us for this survey? *</label>
                                    <div class="d-flex gap-3">
                                        <label class="radio-card flex-fill">
                                            <input type="radio" name="consent" value="Yes" required>
                                            Yes / हाँ
                                        </label>
                                        <label class="radio-card flex-fill">
                                            <input type="radio" name="consent" value="No">
                                            No / नहीं
                                        </label>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-nav-next" id="consent-btn">Proceed <i class="bi bi-arrow-right ms-2"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div id="selection-screen" class="step-container">
                    <div class="text-center mb-4">
                        <h1 class="page-title mb-2">Select Respondent Type</h1>
                        <p class="text-muted">Please choose the type of respondent for this survey.</p>
                    </div>

                    <div class="card shadow-green">
                        <div class="card-body">
                            <form id="respondent-type-form">
                                <div class="mb-4">
                                    <label class="form-label d-block mb-3 fs-5">Nature of Respondent *</label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="Household" required>
                                        Household
                                    </label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="Anganwadi Centre">
                                        Anganwadi Centre
                                    </label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="School with Mid Day Meal Programme">
                                        School with Mid Day Meal Programme
                                    </label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="Gram Panchayat Representative">
                                        Gram Panchayat Representative
                                    </label>
                                </div>

                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-nav-next" id="start-btn">Start Survey <i class="bi bi-arrow-right ms-2"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div id="survey-container" style="display: none;">
                    <div class="text-center mb-4">
                        <h1 class="page-title mb-2" id="survey-title">Survey</h1>
                    </div>

                    <div id="progress-wrapper" class="mb-4">
                        <div class="d-flex justify-content-between">
                            <span class="progress-indicator" id="step-indicator">Step 1 of X</span>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div class="progress-bar bg-success" id="progress-bar" role="progressbar" style="width: 0%;"></div>
                        </div>
                    </div>

                    <form id="main-survey-form">
                        <!-- Sections will be injected here -->
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Data embedded as JSON -->
    <script id="survey-data" type="application/json">

\u0914\u0930 \u0907\u0938\u0915\u093e \u0907\u0938\u094d\u0924\u0947\u092e\u093e\u0932 \u0938\u093f\u0930\u094d\u092b\u093c \u0907\u0938\u0940 \u0938\u094d\u091f\u0921\u0940 \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u092f\u093e \u091c\u093e\u090f\u0917\u093e\u0964 \n\n\u0915\u094d\u092f\u093e \u0906\u092a \u0907\u0938 \u0938\u0930\u094d\u0935\u0947 \u0915\u0947 \u0932\u093f\u090f \u0939\u092e\u093e\u0930\u0947 \u0938\u093e\u0925 \u0905\u092a\u0928\u0940 \u091c\u093e\u0928\u0915\u093e\u0930\u0940 \u0936\u0947\u092f\u0930 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u0939\u092e\u0924 \u0939\u0948\u0902? (\u0928\u0939\u0940\u0902/\u0939\u093e\u0901)"], "Household": [{"title": "Pre-Survey Details", "questions": [{"subsection": "", "text": "Enumerator* (Required)", "required": true, "type": "dropdown select", "options": ["<To be filled based on trainings and finalisation of enumerators>"]}, {"subsection": "", "text": "State* (Required)", "required": true, "type": "dropdown select", "options": ["Bihar", "Uttar Pradesh", "Uttarakhand"]}, {"subsection": "", "text": "District * (Required)", "required": true, "type": "dropdown select", "options": ["Districts based on State selection"]}, {"subsection": "", "text": "Area Classification * (Required)", "required": true, "type": "radio button", "options": ["Urban (Municipal/Corporation)", "Rural (Panchayat/Village)"]}]}, {"title": "Section 1: Household Profile", "questions": [{"subsection": "Personal Information of Respondent", "text": "Full Name * (Required)", "required": true, "type": "text input", "options": []}, {"subsection": "Personal Information of Respondent", "text": "Email Address", "required": false, "type": "email input", "options": []}, {"subsection": "Personal Information", "text": "Country Code", "required": false, "type": "dropdown select", "options": ["+91 (India)", "+971 (UAE)", "+94 (Sri Lanka)", "+44 (UK)", "+1 (USA)"]}, {"subsection": "Personal Information of Respondent", "text": "Contact ling to consider a solar rooftop? * (Required)", "required": true, "type": "dropdown / radio", "options": ["Yes", "No"]}, {"subsection": "Solar Rooftop", "text": "Available rooftop area (m\u00b2) (Required)", "required": true, "type": "number input", "options": []}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "LPG Cylinder Price (\u20b9)", "required": false, "type": "number input", "options": []}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "PNG Rate (\u20b9/SCM)", "required": false, "type": "number input", "options": []}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "Electricity Tariff (\u20b9/kWh)", "required": false, "type": "number input", "options": []}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "Biomass Cost (\u20b9/kg)", "required": false, "type": "number input", "options": []}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "Grid CO\u2082 Factor (kg CO\u2082/kWh)", "required": false, "type": "number input", "options": []}, {"subsection": "Data of Solar PV", "text": "Have you installed have a solar roof top connection?", "required": true, "type": "dropdown select", "options": ["Yes", "No"]}, {"subsection": "Data of Solar PV", "text": "If yes, What is the capacity of your solar rooftop system? (in kWp)", "required": false, "type": "number input", "options": []}, {"subsection": "Data of Solar PV", "text": "If no, would you consider installing rooftop solar?", "required": false, "type": "dropdown select", "options": ["Yes", "No", "Maybe", "Do not have enough information"]}, {"subsection": "Data of Solar PV", "text": "What is the total roof area of your house? (in sq. ft.)", "required": true, "type": "number input", "options": []}]}, {"title": "Section 3: Cooking Needs & Patterns", "questions": [{"subsection": "Kitchen Set-Up", "text": "Kitchen Ventilation Scenario * (Required)", "required": true, "type": "radio option", "options": ["Open Kitchen - Very Low (4% exposure)", "Chimney - Low (25% exposure)", "Exhaust Fan - Moderate (60% exposure)", "No Exhaust - High (80% exposure)"]}, {"subsection": "Cooking Needs", "text": "What time does cooking take place in your household?", "required": true, "type": "dropdown select", "options": ["Early Morning (6 am to 11 am)", "Noon time (11:00 am to 1 pm)", "Afternoon (1 pm - 4pm)", "Evening (4pm to 7pm)", "At night (7 pm onwards)"]}, {"subsection": "Cooking Needs", "text": "Average Cooking Duration per Day (Hours) * (Required)", "required": true, "type": "number input", "options": []}, {"subsection": "Work Division & Agency (who cooks/procures, who decides?)", "text": "Who is responsible for cooking for the family?* (Required)", "required": true, "type": "dropdown", "options": ["Men", "Women", "Any Other members (please specify)", "No fixed responsibility/Depends upon availability"]}]}, {"title": "Section 4: Fuel Use and Fuel use experience", "questions": [{"subsection": "Fuel Use & Stacking", "text": "Select all applicable cooking fuels and sequence them as per the usage* (Required)", "required": true, "type": "drop and sequence", "options": ["LPG", "PNG", "Electricity", "Biogas", "Traditional Solid Biomass (firewood)"]}, {"subsection": "Fuel Use & Stacking", "text": "What % of fuel stacking is done? (ex. 20% from firewood and 80%  from LPG)", "required": false, "type": "text", "options": []}, {"subsection": "Seasonality", "text": "Do you change your fuel source depending on seasonal availability? (for eg. use of LPG during monsoon)", "required": true, "type": "dropdown", "options": ["Yes", "No"]}, {"subsection": "Seasonality", "text": "If yes, which fuel sources do you use and in which season?", "required": false, "type": "text", "options": []}, {"subsection": "Work Division & Agency (who cooks/procures, who decides?)", "text": "Who decides which fuel to procure?", "required": t     <script>
        const surveyData = JSON.parse(document.getElementById('survey-data').textContent);
        let currentType = '';
        let currentSectionIndex = 0;
        let sections = [];

        // Initialize consent text
        if (surveyData.consent && surveyData.consent.length > 0) {
            let consentHtml = '';
            surveyData.consent.forEach(text => {
                consentHtml += `<div class="consent-text-box">${text}</div>`;
            });
            document.getElementById('consent-content').innerHTML = consentHtml;
        }

        document.getElementById('consent-btn').addEventListener('click', function() {
            const form = document.getElementById('consent-form');
            if (!form.reportValidity()) return;

            const selected = document.querySelector('input[name="consent"]:checked');
            if (selected.value === "No") {
                alert("You must provide consent to proceed with the survey.");
                return;
            }

            document.getElementById('consent-screen').classList.remove('active');
            document.getElementById('selection-screen').classList.add('active');
        });

        document.getElementById('start-btn').addEventListener('click', function() {
            const selected = document.querySelector('input[name="respondent_type"]:checked');
            if (!selected) {
                alert('Please select a respondent type');
                return;
            }

            currentType = selected.value;
            sections = surveyData[currentType] || [];

            if (sections.length === 0) {
                alert('No questions available for this respondent type yet.');
                return;
            }

            currentSectionIndex = 0;

            document.getElementById('selection-screen').classList.remove('active');
            document.getElementById('survey-container').style.display = 'block';
            document.getElementById('survey-title').textContent = currentType + ' Survey';

            renderCurrentSection();
        });

        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return String(unsafe)
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
         }

        function renderCurrentSection() {
            const form = document.getElementById('main-survey-form');
            form.innerHTML = '';

            if (currentSectionIndex >= sections.length) {
                // Completed
                form.innerHTML = `
                    <div class="card text-center py-5 shadow-green">
                        <div class="card-body">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                            <h2 class="mt-3 text-success">Survey Completed!</h2>
                            <p class="text-muted">Thank you for providing the information.</p>
                            <button type="button" class="btn btn-nav-back mt-3" onclick="location.reload()">Back to Start</button>
                        </div>
                    </div>
                `;
                document.getElementById('progress-wrapper').style.display = 'none';
                return;
            }

            const section = sections[currentSectionIndex];

            // Update progress
            const progressPct = ((currentSectionIndex + 1) / sections.length) * 100;
            document.getElementById('step-indicator').textContent = `${section.title} (Step ${currentSectionIndex + 1} of ${sections.length})`;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            // Create card for section
            const card = document.createElement('div');
            card.className = 'card shadow-green step-container active';

            let cardBody = `
                <div class="card-body">
                    <h2 class="section-heading"><i class="bi bi-card-list me-2"></i>${section.title}</h2>
                    <hr class="mb-4 text-muted">
                    <div class="row g-4">
            `;

            let currentSubsection = "";

            // Add questions
            section.questions.forEach((q, idx) => {
                // Add subsection header if it changed and exists
                if (q.subsection && q.subsection !== currentSubsection) {
                    currentSubsection = q.subsection;
                    cardBody += `<div class="col-12"><h3 class="subsection-heading">${currentSubsection}</h3></div>`;
                }

                const reqStar = q.required ? '<span class="text-danger">*</span>' : '';
                const qId = `q_${currentSectionIndex}_${idx}`;

                cardBody += `<div class="col-12"><div class="question-container">`;
                cardBody += `<label class="form-label">${q.text} ${reqStar}</label>`;

                // Render based on type and options
                const typeLower = q.type ? q.type.toLowerCase() : '';

                if (q.options && q.options.length > 0) {
                    if (typeLower.includes('dropdown') || q.options.length > 5) {
                        cardBody += `<select class="form-select" name="${qId}" ${q.required ? 'required' : ''}>`;
                        cardBody += `<option value="">Select an option</option>`;
                        q.options.forEach(opt => {
                            if (opt && opt.trim() !== '') {
                                cardBody += `<option value="${escapeHtml(opt)}">${opt}</option>`;
                            }
                        });
                        cardBody += `</select>`;
                    } else {
                        // Radio buttons
                        cardBody += `<div class="mt-2">`;
                        q.options.forEach((opt, oIdx) => {
                             if (opt && opt.trim() !== '') {
                                cardBody += `
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="${qId}" id="${qId}_${oIdx}" value="${escapeHtml(opt)}" ${q.required ? 'required' : ''}>
                                    <label class="form-check-label" for="${qId}_${oIdx}">${opt}</label>
                                </div>`;
                            }
                        });
                        cardBody += `</div>`;
                    }
                } else if (typeLower.includes('number') || typeLower.includes('numeric')) {
                    cardBody += `<input type="number" class="form-control" name="${qId}" ${q.required ? 'required' : ''}>`;
                } else if (typeLower.includes('email')) {
                    cardBody += `<input type="email" class="form-control" name="${qId}" ${q.required ? 'required' : ''}>`;
                } else if (typeLower.includes('phone') || typeLower.includes('contact')) {
                    cardBody += `<input type="tel" class="form-control" name="${qId}" ${q.required ? 'required' : ''}>`;
                } else {
                    cardBody += `<input type="text" class="form-control" name="${qId}" ${q.required ? 'required' : ''}>`;
                }

                cardBody += `</div></div>`;
            });

            cardBody += `</div></div>`;
            card.innerHTML = cardBody;
            form.appendChild(card);

            // Navigation buttons
            const navDiv = document.createElement('div');
            navDiv.className = 'd-flex justify-content-between mt-4 mb-2';

            let btnHTML = '';
            if (currentSectionIndex > 0) {
                btnHTML += `<button type="button" class="btn btn-nav-back" onclick="prevSection()"><i class="bi bi-arrow-left me-2"></i>Back</button>`;
            } else {
                // If they are on the first section of the survey (index 0), going back returns them to selection
                btnHTML += `<button type="button" class="btn btn-nav-back" onclick="backToSelection()"><i class="bi bi-arrow-left me-2"></i>Back</button>`;
            }

            btnHTML += `<button type="button" class="btn btn-nav-next ms-auto" onclick="nextSection()">${currentSectionIndex === sections.length - 1 ? 'Submit' : 'Next'} <i class="bi bi-arrow-right ms-2"></i></button>`;

            navDiv.innerHTML = btnHTML;
            form.appendChild(navDiv);

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.backToSelection = function() {
            document.getElementById('survey-container').style.display = 'none';
            document.getElementById('selection-screen').classList.add('active');
        };

        window.nextSection = function() {
            // Basic validation
            const form = document.getElementById('main-survey-form');
            if (!form.reportValidity()) {
                return;
            }

            currentSectionIndex++;
            renderCurrentSection();
        };

        window.prevSection = function() {
            currentSectionIndex--;
            renderCurrentSection();
        };
    </script>
