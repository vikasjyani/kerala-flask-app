<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Cooking Survey</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #004d40;
            --brand-soft: #e0f2f1;
            --brand: #00897b;
            --radius-lg: 12px;
            --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            --shadow-green: 0 4px 12px rgba(0, 77, 64, 0.08);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding-bottom: 50px;
        }

        .header-container {
            background: white;
            box-shadow: var(--shadow-sm);
        }

        .top-bar {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .green-strip {
            background-color: var(--brand-green);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-title {
            color: var(--brand-green);
            font-weight: 700;
        }

        .card {
            border: none;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-green);
            margin-bottom: 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .section-heading {
            color: var(--brand-green);
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }

        .subsection-heading {
            color: #555;
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eaeaea;
        }

        .form-label {
            font-weight: 500;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.75rem;
            border-color: #ced4da;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.25rem rgba(0, 137, 123, 0.25);
        }

        .btn-nav-next {
            background-color: var(--brand-green);
            color: white;
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            border: none;
        }

        .btn-nav-next:hover {
            background-color: #00332a;
            color: white;
        }

        .btn-nav-back {
            background-color: transparent;
            color: var(--brand-green);
            border: 1px solid var(--brand-green);
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
        }

        .btn-nav-back:hover {
            background-color: var(--brand-soft);
            color: var(--brand-green);
        }

        .radio-card, .checkbox-card {
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .radio-card:hover, .checkbox-card:hover {
            background-color: var(--brand-soft);
            border-color: var(--brand);
        }

        .radio-card input[type="radio"], .checkbox-card input[type="checkbox"] {
            margin-right: 12px;
            width: 1.2em;
            height: 1.2em;
        }

        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-indicator {
            font-size: 0.875rem;
            color: var(--brand);
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .question-container {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: #fcfcfc;
            border-radius: 8px;
            border-left: 4px solid var(--brand-green);
            transition: opacity 0.3s;
        }

        .consent-text-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #495057;
        }

        .conditional-help {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-container mb-4">
        <div class="green-strip">
            <div class="d-flex align-items-center">
                <span class="ms-2 text-white fw-bold fs-5">Clean Cooking Survey</span>
            </div>
        </div>
    </div>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div id="consent-screen" class="step-container active">
                    <div class="text-center mb-4">
                        <h1 class="page-title mb-2">About the Study & Consent</h1>
                    </div>
                    <div class="card shadow-green">
                        <div class="card-body">
                            <form id="consent-form">
                                <div id="consent-content">
                                    <!-- Consent text loaded here -->
                                </div>

                                <div class="mb-4">
                                    <label class="form-label d-block mb-3 fs-6">Do you consent to share your information with us for this survey? *</label>
                                    <div class="d-flex gap-3">
                                        <label class="radio-card flex-fill">
                                            <input type="radio" name="consent" value="Yes" required>
                                            Yes / हाँ
                                        </label>
                                        <label class="radio-card flex-fill">
                                            <input type="radio" name="consent" value="No">
                                            No / नहीं
                                        </label>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-nav-next" id="consent-btn">Proceed <i class="bi bi-arrow-right ms-2"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div id="selection-screen" class="step-container">
                    <div class="text-center mb-4">
                        <h1 class="page-title mb-2">Select Respondent Type</h1>
                        <p class="text-muted">Please choose the type of respondent for this survey.</p>
                    </div>

                    <div class="card shadow-green">
                        <div class="card-body">
                            <form id="respondent-type-form">
                                <div class="mb-4">
                                    <label class="form-label d-block mb-3 fs-5">Nature of Respondent *</label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="Household" required>
                                        Household
                                    </label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="Anganwadi Centre">
                                        Anganwadi Centre
                                    </label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="School with Mid Day Meal Programme">
                                        School with Mid Day Meal Programme
                                    </label>

                                    <label class="radio-card">
                                        <input type="radio" name="respondent_type" value="Gram Panchayat Representative">
                                        Gram Panchayat Representative
                                    </label>
                                </div>

                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-nav-next" id="start-btn">Start Survey <i class="bi bi-arrow-right ms-2"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div id="survey-container" style="display: none;">
                    <div class="text-center mb-4">
                        <h1 class="page-title mb-2" id="survey-title">Survey</h1>
                    </div>

                    <div id="progress-wrapper" class="mb-4">
                        <div class="d-flex justify-content-between">
                            <span class="progress-indicator" id="step-indicator">Step 1 of X</span>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div class="progress-bar bg-success" id="progress-bar" role="progressbar" style="width: 0%;"></div>
                        </div>
                    </div>

                    <form id="main-survey-form">
                        <!-- Sections will be injected here -->
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Data embedded as JSON -->
    <script id="survey-data" type="application/json">

\u0914\u0930 \u0907\u0938\u0915\u093e \u0907\u0938\u094d\u0924\u0947\u092e\u093e\u0932 \u0938\u093f\u0930\u094d\u092b\u093c \u0907\u0938\u0940 \u0938\u094d\u091f\u0921\u0940 \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u092f\u093e \u091c\u093e\u090f\u0917\u093e\u0964 \n\n\u0915\u094d\u092f\u093e \u0906\u092a \u0907\u0938 \u0938\u0930\u094d\u0935\u0947 \u0915\u0947 \u0932\u093f\u090f \u0939\u092e\u093e\u0930\u0947 \u0938\u093e\u0925 \u0905\u092a\u0928\u0940 \u091c\u093e\u0928\u0915\u093e\u0930\u0940 \u0936\u0947\u092f\u0930 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u0939\u092e\u0924 \u0939\u0948\u0902? (\u0928\u0939\u0940\u0902/\u0939\u093e\u0901)"], "Household": [{"title": "Pre-Survey Details", "questions": [{"subsection": "", "text": "Enumerator* (Required)", "required": true, "type": "dropdown select", "options": ["<To be filled based on trainings and finalisation of enumerators>"], "validation": "-", "default": ""}, {"subsection": "", "text": "State* (Required)", "required": true, "type": "dropdown select", "options": ["Bihar", "Uttar Pradesh", "Uttarakhand"], "validation": "No pre-selection", "default": "None ('Select scenario' prompt)"}, {"subsection": "", "text": "District * (Required)", "required": true, "type": "dropdown select", "options": ["Districts based on State selection"], "validation": "Required, both for gendered study, and for district-specific solar irradiance and tariff models.", "default": "None ('Select District' prompt)"}, {"subsection": "", "text": "Area Classification * (Required)", "required": true, "type": "radio button", "options": ["Urban (Municipal/Corporation)", "Rural (Panchayat/Village)"], "validation": "Required. Dictates PNG availability feasibility.", "default": "None ('Select Area Classification' prompt)"}]}, {"title": "Section 1: Household Profile", "questions": [{"subsection": "Personal Information of Respondent", "text": "Full Name * (Required)", "required": true, "type": "text input", "options": [], "validation": "-", "default": "Placeholder: 'Your Name'."}, {"subsection": "Personal Information of Respondent", "text": "Email Address", "required": false, "type": "email input", "options": [], "validation": "Give automatic option to select @gmail, @yahoo and other domains", "default": "Empty (User entered)"}, {"subsection": "Personal Information", "text": "Country Code", "required": false, "type": "dropdown select", "options": ["+91 (India)", "+971 (UAE)", "+94 (Sri Lanka)", "+44 (UK)", "+1 (USA)"], "validation": "Pre-selected to +91 (India).", "default": "+91 (India)"}, {"subsection": "Personal Information of Respondent", "text": "Contact Number * (Required)", "required": true, "type": "phone input", "options": [], "validation": "Display error if number exceeds 10 digits", "default": "Present +91 country code"}, {"subsection": "Household Details", "text": "Number of Household Members * (Required)", "required": true, "type": "number input, with specified labels", "options": [], "validation": "-", "default": "Empty (User entered)"}, {"subsection": "Household Details", "text": "District * (Required)", "required": true, "type": "dropdown select", "options": ["Districts based on State selection"], "validation": "Required, both for gendered study, and for district-specific solar irradiance and tariff models.", "default": "None ('Select District' prompt)"}, {"subsection": "Household Details", "text": "Area Classification * (Required)", "required": true, "type": "text input", "options": [], "validation": "Required. Dictates PNG availability feasibility.", "default": "None ('Select Area Classification' prompt)"}, {"subsection": "Household Details", "text": "How many member stay at home during the day", "required": true, "type": "number input, with specified labels", "options": [], "validation": "", "default": ""}, {"subsection": "Household Details", "text": "Annual Household Income (\u20b9) * (Required)", "required": true, "type": "dropdown select", "options": ["Less than 1,50,000", "1,50,000- 2,50,000", "2,50,000-3,50,000", "More than 3,50,000"], "validation": "-", "default": "None ('Select Monthly Income' prompt)"}]}, {"title": "Section 2: Access to Electricity and Solar", "questions": [{"subsection": "Electricity Supply & Consumption", "text": "How many hours in a day do you face electricity outages?* (Required)", "required": true, "type": "dropdown select", "options": ["No outage", "Less than 30 minutes", "1-2 hours/day", "2-3 hours/day", "3-5 hours/day or more"], "validation": "", "default": "Empty (User selected)"}, {"subsection": "Electricity Supply & Consumption", "text": "What time in the day do you experience power outage?", "required": false, "type": "dropdown select", "options": ["Early Morning (6 am to 11 am)", "Noon time (11:00 am to 1 pm)", "Afternoon (1 pm - 4pm)", "Evening (4pm to 7pm)", "At night (7 pm onwards)"], "validation": "Only, if previous question's anwsers are anthing other than ' no outage\" option", "default": "Empty (User selected)"}, {"subsection": "Electricity Supply & Consumption", "text": "What time in the day is reliable electricity available?* (Required)", "required": true, "type": "checkbox", "options": ["Overnight (12am to 6am)", "Morning (6am-11am)", "Noon (11am-2pm)", "Afternoon/Early Evening (2pm-6pm)", "Evening (6pm-12pm)"], "validation": "Multiple selection possible", "default": "Empty (User selected)"}, {"subsection": "Solar Rooftop", "text": "Are you willing to consider a solar rooftop? * (Required)", "required": true, "type": "dropdown / radio", "options": ["Yes", "No"], "validation": "Required. Selecting 'Yes' reveals the available rooftop area input.", "default": "None ('Select an option' prompt)"}, {"subsection": "Solar Rooftop", "text": "Available rooftop area (m\u00b2) (Required)", "required": true, "type": "number input", "options": [], "validation": "Required only if solar willingness is 'Yes'. Disabled/hidden if 'No'.", "default": "50 m\u00b2"}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "LPG Cylinder Price (\u20b9)", "required": false, "type": "number input", "options": [], "validation": "Price per standard 14.2 kg domestic LPG cylinder.", "default": "\u20b9 922.00"}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "PNG Rate (\u20b9/SCM)", "required": false, "type": "number input", "options": [], "validation": "Rate per Standard Cubic Metre for piped natural gas.", "default": "\u20b9 54.00 / SCM"}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "Electricity Tariff (\u20b9/kWh)", "required": false, "type": "number input", "options": [], "validation": "Applicable domestic average grid slab rate in Kerala.", "default": "\u20b9 6.50 / kWh"}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "Biomass Cost (\u20b9/kg)", "required": false, "type": "number input", "options": [], "validation": "Average cost per kg of firewood or agricultural biomass.", "default": "\u20b9 5.00 / kg"}, {"subsection": "Fuel Prices for Your Estimate (Optional Baseline Overrides)", "text": "Grid CO\u2082 Factor (kg CO\u2082/kWh)", "required": false, "type": "number input", "options": [], "validation": "Kerala state grid carbon intensity factor for lifecycle emissions.", "default": "0.65 kg CO\u2082/kWh"}, {"subsection": "Data of Solar PV", "text": "Have you installed have a solar roof top connection?", "required": true, "type": "dropdown select", "options": ["Yes", "No"], "validation": "", "default": "Empty (User selected)"}, {"subsection": "Data of Solar PV", "text": "If yes, What is the capacity of your solar rooftop system? (in kWp)", "required": false, "type": "number input", "options": [], "validation": "Only to be asked if previous anwser was \"Yes\"", "default": ""}, {"subsection": "Data of Solar PV", "text": "If no, would you consider installing rooftop solar?", "required": false, "type": "dropdown select", "opti ng prompts fuel assignment modal.", "default": "None selected"}, {"subsection": "Method B: Dish-based Modelling", "text": "Lunch Type", "required": false, "type": "text input", "options": [], "validation": "In Kerala cuisine, lunch is typically the heaviest daily meal.", "default": "Heavy (Pre-selected)"}, {"subsection": "Method B: Dish-based Modelling", "text": "Select Lunch Dishes", "required": false, "type": "dish matrix selection", "options": ["Database items: Rice Meals", "Sambar", "Fish Curry", "Chicken Curry", "Thoran", "Moru Curry", "etc."], "validation": "Clicking prompts fuel assignment modal.", "default": "None selected"}, {"subsection": "Method B: Dish-based Modelling", "text": "Dinner Type", "required": false, "type": "text input", "options": [], "validation": "Dinner defaults to light in Kerala dietary patterns.", "default": "Light (Pre-selected)"}, {"subsection": "Method B: Dish-based Modelling", "text": "Select Dinner Dishes", "required": false, "type": "dish matrix selection", "options": ["Database items: Chappathi", "Kanji with Payar", "Vegetable Stew", "Dosa", "etc."], "validation": "Clicking prompts fuel assignment modal.", "default": "None selected"}, {"subsection": "Method B: Dish-based Modelling", "text": "Select Snacks Dishes", "required": false, "type": "dish matrix selection", "options": ["Database items: Tea/Coffee", "Banana Fritters (Pazham Pori)", "Sukhiyan", "Parippu Vada", "etc."], "validation": "Snacks and beverage preparation energy calculation.", "default": "None selected"}]}], "Gram Panchayat Representative": [{"title": "Pre-Survey Details", "questions": [{"subsection": "", "text": "Enumerator* (Required)", "required": true, "type": "dropdown select", "options": ["<To be filled based on trainings and finalisation of enumerators>"], "validation": "-", "default": ""}, {"subsection": "", "text": "State* (Required)", "required": true, "type": "dropdown select", "options": ["Bihar", "Uttar Pradesh", "Uttarakhand"], "validation": "No pre-selection", "default": "None ('Select scenario' prompt)"}, {"subsection": "", "text": "District * (Required)", "required": true, "type": "dropdown select", "options": ["Districts based on State selection"], "validation": "Required, both for gendered study, and for district-specific solar irradiance and tariff models.", "default": "None ('Select District' prompt)"}, {"subsection": "", "text": "Area Classification * (Required)", "required": true, "type": "radio button", "options": ["Urban (Municipal/Corporation)", "Rural (Panchayat/Village)"], "validation": "Required. Dictates PNG availability feasibility.", "default": "None ('Select Area Classification' prompt)"}]}]}
    </script>

    <script>
        const surveyData = JSON.parse(document.getElementById('survey-data').textContent);
        let currentType = '';
        let currentSectionIndex = 0;
        let sections = [];
        let sectionAnswers = {}; // Store answers across sections

        // Initialize consent text
        if (surveyData.consent && surveyData.consent.length > 0) {
            let consentHtml = '';
            surveyData.consent.forEach(text => {
                consentHtml += `<div class="consent-text-box">${text}</div>`;
            });
            document.getElementById('consent-content').innerHTML = consentHtml;
        }

        document.getElementById('consent-btn').addEventListener('click', function() {
            const form = document.getElementById('consent-form');
            if (!form.reportValidity()) return;

            const selected = document.querySelector('input[name="consent"]:checked');
            if (selected.value === "No") {
                alert("You must provide consent to proceed with the survey.");
                return;
            }

            document.getElementById('consent-screen').classList.remove('active');
            document.getElementById('selection-screen').classList.add('active');
        });

        document.getElementById('start-btn').addEventListener('click', function() {
            const selected = document.querySelector('input[name="respondent_type"]:checked');
            if (!selected) {
                alert('Please select a respondent type');
                return;
            }

            currentType = selected.value;
            sections = surveyData[currentType] || [];

            if (sections.length === 0) {
                alert('No questions available for this respondent type yet.');
                return;
            }

            currentSectionIndex = 0;
            sectionAnswers = {};

            document.getElementById('selection-screen').classList.remove('active');
            document.getElementById('survey-container').style.display = 'block';
            document.getElementById('survey-title').textContent = currentType + ' Survey';

            renderCurrentSection();
        });

        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return String(unsafe)
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
         }

        function setupConditionalLogic() {
            const form = document.getElementById('main-survey-form');
            const inputs = form.querySelectorAll('input, select');

            // Re-evaluate logic on any change
            inputs.forEach(input => {
                input.addEventListener('change', evaluateConditions);
            });

            // Initial evaluation
            evaluateConditions();
        }

        function evaluateConditions() {
            const containers = document.querySelectorAll('.question-container');

            // We need a simple way to parse the validation logic.
            // Many "Validation" fields in Excel say "Only if previous question is XYZ"
            // We can do this programmatically by checking the adjacent question's value.

            // For now, if a container has a data-validation attribute, we check it
            containers.forEach((container, idx) => {
                const validationStr = (container.getAttribute('data-validation') || '').toLowerCase();
                if (!validationStr || validationStr === '-' || validationStr === 'nan') return;

                let shouldShow = true;

                // Extremely common patterns in the validation text
                if (validationStr.includes("only if previous question")) {
                    // Try to get previous input
                    if (idx > 0) {
                        const prevContainer = containers[idx - 1];
                        const prevInputs = prevContainer.querySelectorAll('input, select');
                        let prevVal = '';

                        if (prevInputs.length > 0) {
                            if (prevInputs[0].type === 'radio') {
                                const checked = prevContainer.querySelector('input[type="radio"]:checked');
                                prevVal = checked ? checked.value.toLowerCase() : '';
                            } else if (prevInputs[0].type === 'select-one') {
                                prevVal = prevInputs[0].value.toLowerCase();
                            }
                        }

                        if (validationStr.includes("yes")) {
                            shouldShow = prevVal.includes('yes');
                        } else if (validationStr.includes("no")) {
                            shouldShow = prevVal.includes('no');
                        }
                    }
                } else if (validationStr.includes("visible when primary fuel = lpg")) {
                    shouldShow = isFuelSelected('lpg');
                } else if (validationStr.includes("visible when primary fuel = png")) {
                    shouldShow = isFuelSelected('png');
                } else if (validationStr.includes("visible when primary fuel = electricity")) {
                    shouldShow = isFuelSelected('electricity');
                } else if (validationStr.includes("visible when primary fuel = traditional solid biomass") || validationStr.includes("firewood")) {
                    shouldShow = isFuelSelected('biomass') || isFuelSelected('firewood');
                } else if (validationStr.includes("subject to selection of 'yes'")) {
                    // Look back up to 2 questions
                    let foundYes = false;
                    for (let i = 1; i <= 2; i++) {
                        if (idx >= i) {
                            const pContainer = containers[idx - i];
                            const pChecked = pContainer.querySelector('input[type="radio"]:checked');
                            if (pChecked && pChecked.value.toLowerCase().includes('yes')) {
                                foundYes = true;
                                break;
                            }
                        }
                    }
                    shouldShow = foundYes;
                }

                if (shouldShow) {
                    container.style.display = 'block';
                    // Re-enable required fields if they were supposed to be required
                    if (container.getAttribute('data-required') === 'true') {
                        container.querySelectorAll('input, select').forEach(el => el.required = true);
                    }
                } else {
                    container.style.display = 'none';
                    // Disable validation for hidden fields
                    container.querySelectorAll('input, select').forEach(el => el.required = false);
                }
            });
        }

        function isFuelSelected(fuelStr) {
            // Check all forms to see if a fuel is selected
            const selects = document.querySelectorAll('select');
            for(let i=0; i<selects.length; i++) {
                if (selects[i].value.toLowerCase().includes(fuelStr)) return true;
            }
            const radios = document.querySelectorAll('input[type="radio"]:checked');
            for(let i=0; i<radios.length; i++) {
                if (radios[i].value.toLowerCase().includes(fuelStr)) return true;
            }
            // Check cross-section history
            for (const key in sectionAnswers) {
                if (String(sectionAnswers[key]).toLowerCase().includes(fuelStr)) return true;
            }
            return false;
        }

        function saveCurrentSectionAnswers() {
            const form = document.getElementById('main-survey-form');
            const formData = new FormData(form);
            for (let [key, value] of formData.entries()) {
                sectionAnswers[key] = value;
            }
        }

        function restoreCurrentSectionAnswers() {
            const form = document.getElementById('main-survey-form');
            for (const key in sectionAnswers) {
                const els = form.querySelectorAll(`[name="${key}"]`);
                if (els.length > 0) {
                    if (els[0].type === 'radio' || els[0].type === 'checkbox') {
                        els.forEach(el => {
                            if (el.value === sectionAnswers[key]) el.checked = true;
                        });
                    } else {
                        els[0].value = sectionAnswers[key];
                    }
                }
            }
        }

        function renderCurrentSection() {
            const form = document.getElementById('main-survey-form');
            form.innerHTML = '';

            if (currentSectionIndex >= sections.length) {
                // Completed
                form.innerHTML = `
                    <div class="card text-center py-5 shadow-green">
                        <div class="card-body">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                            <h2 class="mt-3 text-success">Survey Completed!</h2>
                            <p class="text-muted">Thank you for providing the information.</p>
                            <button type="button" class="btn btn-nav-back mt-3" onclick="location.reload()">Back to Start</button>
                        </div>
                    </div>
                `;
                document.getElementById('progress-wrapper').style.display = 'none';
                return;
            }

            const section = sections[currentSectionIndex];

            // Check if section itself is conditional
            const lowerTitle = section.title.toLowerCase();
            if (lowerTitle.includes("if ") && lowerTitle.includes("chosen")) {
                let shouldShowSection = false;
                if (lowerTitle.includes("lpg")) shouldShowSection = isFuelSelected("lpg");
                else if (lowerTitle.includes("electricity")) shouldShowSection = isFuelSelected("electricity");
                else if (lowerTitle.includes("biomaas") || lowerTitle.includes("firewood")) shouldShowSection = isFuelSelected("biomass") || isFuelSelected("firewood");

                if (!shouldShowSection) {
                    // Skip this section
                    if (window._navDirection === 'prev') {
                        currentSectionIndex--;
                        return renderCurrentSection();
                    } else {
                        currentSectionIndex++;
                        return renderCurrentSection();
                    }
                }
            }

            // Update progress
            const progressPct = ((currentSectionIndex + 1) / sections.length) * 100;
            document.getElementById('step-indicator').textContent = `${section.title} (Step ${currentSectionIndex + 1} of ${sections.length})`;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            // Create card for section
            const card = document.createElement('div');
            card.className = 'card shadow-green step-container active';

            let cardBody = `
                <div class="card-body">
                    <h2 class="section-heading"><i class="bi bi-card-list me-2"></i>${section.title}</h2>
                    <hr class="mb-4 text-muted">
                    <div class="row g-4">
            `;

            let currentSubsection = "";

            // Add questions
            section.questions.forEach((q, idx) => {
                if (q.subsection && q.subsection !== currentSubsection) {
                    currentSubsection = q.subsection;
                    cardBody += `<div class="col-12"><h3 class="subsection-heading">${currentSubsection}</h3></div>`;
                }

                const reqStar = q.required ? '<span class="text-danger">*</span>' : '';
                const qId = `q_${currentSectionIndex}_${idx}`;
                const valAttr = q.validation ? `data-validation="${escapeHtml(q.validation)}"` : '';

                cardBody += `<div class="col-12"><div class="question-container" ${valAttr} data-required="${q.required}">`;
                cardBody += `<label class="form-label">${q.text} ${reqStar}</label>`;

                // Show validation helper text if useful
                if (q.validation && q.validation !== '-' && !q.validation.toLowerCase().includes('required')) {
                    cardBody += `<div class="conditional-help mb-2">${escapeHtml(q.validation)}</div>`;
                }

                const typeLower = q.type ? q.type.toLowerCase() : '';

                if (q.options && q.options.length > 0) {
                    if (typeLower.includes('dropdown') || q.options.length > 5) {
                        cardBody += `<select class="form-select" name="${qId}" ${q.required ? 'required' : ''}>`;
                        cardBody += `<option value="">Select an option</option>`;
                        q.options.forEach(opt => {
                            if (opt && opt.trim() !== '') {
                                const selected = (q.default && opt.includes(q.default)) ? 'selected' : '';
                                cardBody += `<option value="${escapeHtml(opt)}" ${selected}>${opt}</option>`;
                            }
                        });
                        cardBody += `</select>`;
                    } else if (typeLower.includes('checkbox') || (q.validation && q.validation.toLowerCase().includes('multiple'))) {
                        // Checkboxes
                        cardBody += `<div class="mt-2">`;
                        q.options.forEach((opt, oIdx) => {
                             if (opt && opt.trim() !== '') {
                                cardBody += `
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" name="${qId}[]" id="${qId}_${oIdx}" value="${escapeHtml(opt)}">
                                    <label class="form-check-label" for="${qId}_${oIdx}">${opt}</label>
                                </div>`;
                            }
                        });
                        cardBody += `</div>`;
                    } else {
                        // Radio buttons
                        cardBody += `<div class="mt-2">`;
                        q.options.forEach((opt, oIdx) => {
                             if (opt && opt.trim() !== '') {
                                const checked = (q.default && opt.includes(q.default)) ? 'checked' : '';
                                cardBody += `
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="${qId}" id="${qId}_${oIdx}" value="${escapeHtml(opt)}" ${q.required ? 'required' : ''} ${checked}>
                                    <label class="form-check-label" for="${qId}_${oIdx}">${opt}</label>
                                </div>`;
                            }
                        });
                        cardBody += `</div>`;
                    }
                } else if (typeLower.includes('number') || typeLower.includes('numeric')) {
                    const placeholder = q.default ? `placeholder="${escapeHtml(q.default)}"` : '';
                    cardBody += `<input type="number" class="form-control" name="${qId}" ${q.required ? 'required' : ''} ${placeholder}>`;
                } else if (typeLower.includes('email')) {
                    cardBody += `<input type="email" class="form-control" name="${qId}" ${q.required ? 'required' : ''}>`;
                } else if (typeLower.includes('phone') || typeLower.includes('contact')) {
                    cardBody += `<input type="tel" class="form-control" name="${qId}" ${q.required ? 'required' : ''}>`;
                } else {
                    const placeholder = q.default ? `placeholder="${escapeHtml(q.default)}"` : '';
                    cardBody += `<input type="text" class="form-control" name="${qId}" ${q.required ? 'required' : ''} ${placeholder}>`;
                }

                cardBody += `</div></div>`;
            });

            cardBody += `</div></div>`;
            card.innerHTML = cardBody;
            form.appendChild(card);

            // Navigation buttons
            const navDiv = document.createElement('div');
            navDiv.className = 'd-flex justify-content-between mt-4 mb-2';

            let btnHTML = '';
            if (currentSectionIndex > 0) {
                btnHTML += `<button type="button" class="btn btn-nav-back" onclick="prevSection()"><i class="bi bi-arrow-left me-2"></i>Back</button>`;
            } else {
                btnHTML += `<button type="button" class="btn btn-nav-back" onclick="backToSelection()"><i class="bi bi-arrow-left me-2"></i>Back</button>`;
            }

            btnHTML += `<button type="button" class="btn btn-nav-next ms-auto" onclick="nextSection()">${currentSectionIndex === sections.length - 1 ? 'Submit' : 'Next'} <i class="bi bi-arrow-right ms-2"></i></button>`;

            navDiv.innerHTML = btnHTML;
            form.appendChild(navDiv);

            restoreCurrentSectionAnswers();
            setupConditionalLogic();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.backToSelection = function() {
            document.getElementById('survey-container').style.display = 'none';
            document.getElementById('selection-screen').classList.add('active');
        };

        window.nextSection = function() {
            const form = document.getElementById('main-survey-form');
            if (!form.reportValidity()) {
                return;
            }

            saveCurrentSectionAnswers();
            window._navDirection = 'next';
            currentSectionIndex++;
            renderCurrentSection();
        };

        window.prevSection = function() {
            saveCurrentSectionAnswers();
            window._navDirection = 'prev';
            currentSectionIndex--;
            renderCurrentSection();
        };
    </script>
</body>
</html>
